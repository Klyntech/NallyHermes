<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0;url=https://nally.onrender.com/account">
  <title>Continue to Nally Account</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b0b0c;color:#f7f3ea}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{width:min(100%,420px);text-align:center}
    .mark{width:56px;height:56px;margin:0 auto 20px;border-radius:16px;display:grid;place-items:center;background:#e8b86d;color:#1a1408;font-size:25px;font-weight:700}
    p{color:#a8a29a;line-height:1.6}
    a{display:inline-block;margin-top:14px;padding:13px 20px;border-radius:10px;background:#e8b86d;color:#1a1408;text-decoration:none;font-weight:650}
  </style>
  <script>window.location.replace("https://nally.onrender.com/account");</script>
</head>
<body>
  <main>
    <div class="mark">N</div>
    <h1>Continue to Nally Account</h1>
    <p>Your secure Nally sign-in now lives in the main Nally application. Redirecting you there…</p>
    <a href="https://nally.onrender.com/account">Continue to Nally Account</a>
  </main>
</body>
</html>
