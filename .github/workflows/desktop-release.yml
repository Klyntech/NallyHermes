name: DeskDear Desktop Builds

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'include/**'
      - 'ui/**'
      - 'packaging/**'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deskdear-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.8.3'

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            artifact: DeskDear-Setup
          - name: Linux x64
            os: ubuntu-22.04
            artifact: DeskDear-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.os == 'windows-2022' && 'windows' || 'linux' }}
          target: desktop
          arch: ${{ matrix.os == 'windows-2022' && 'win64_msvc2022_64' || 'linux_gcc_64' }}
          modules: 'qtshadertools'
          cache: true

      - name: Install NSIS (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $candidates = @(
            "C:\Program Files (x86)\NSIS",
            "C:\Program Files\NSIS"
          )
          foreach ($nsis in $candidates) {
            if (Test-Path "$nsis\makensis.exe") {
              echo "$nsis" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              Write-Host "NSIS found at $nsis"
              break
            }
          }
          makensis /VERSION

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build
          -DDESKDEAR_BUILD_UI=ON
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/staging

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install application
        run: cmake --install build --config Release --prefix staging

      - name: Deploy Qt + build Setup.exe (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ui = "staging\bin\deskdear-ui.exe"
          if (-not (Test-Path $ui)) {
            throw "deskdear-ui.exe not found at $ui"
          }

          # Deploy Qt runtime + QML modules next to the UI binary
          windeployqt --release --qmldir ui/qml --compiler-runtime $ui

          # Ensure the Windows platform plugin is present (hard requirement)
          if (-not (Test-Path "staging\bin\platforms\qwindows.dll")) {
            throw "platforms/qwindows.dll missing after windeployqt — UI will not start"
          }

          if (Test-Path "staging\bin\deskdear.exe") {
            Write-Host "CLI deskdear.exe present in staging/bin"
          }

          # Single installable artifact — no portable ZIP
          $stagingAbs = (Resolve-Path "staging").Path
          $outExe = Join-Path (Get-Location) "DeskDear-Setup.exe"
          $nsiPath = Join-Path (Get-Location) "packaging\windows\deskdear.nsi"

          if (-not (Test-Path $nsiPath)) {
            throw "NSIS script missing: $nsiPath"
          }

          & makensis `
            "/DSTAGING_DIR=$stagingAbs" `
            "/DOUTFILE=$outExe" `
            "/DPRODUCT_VERSION=0.1.0" `
            $nsiPath

          if ($LASTEXITCODE -ne 0) {
            throw "makensis failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path $outExe)) {
            throw "Expected installer not found: $outExe"
          }

          $sizeMb = [math]::Round((Get-Item $outExe).Length / 1MB, 1)
          if ($sizeMb -lt 5) {
            throw "Installer is only $sizeMb MB — packaging almost certainly incomplete"
          }
          Write-Host "Installer ready: $outExe ($sizeMb MB)"

      - name: Package Linux application
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp -a staging/. AppDir/usr/
          cp packaging/linux/deskdear.desktop AppDir/usr/share/applications/
          cp packaging/linux/deskdear.svg AppDir/usr/share/icons/hicolor/scalable/apps/deskdear.svg
          curl -L --fail --retry 3 -o linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L --fail --retry 3 -o linuxdeploy-plugin-qt.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          export PATH="$PWD:$PATH"
          export QMAKE=$(command -v qmake6 || command -v qmake)
          export QMLDIR="$PWD/ui/qml"
          ./linuxdeploy.AppImage --appdir AppDir --plugin qt --output appimage
          mv DeskDear*.AppImage "${{ matrix.artifact }}.AppImage"
          tar -czf "${{ matrix.artifact }}.tar.gz" -C AppDir .

      - name: Upload Windows Setup.exe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DeskDear-Setup
          path: DeskDear-Setup.exe
          if-no-files-found: error

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.AppImage
            *.tar.gz
          if-no-files-found: error
