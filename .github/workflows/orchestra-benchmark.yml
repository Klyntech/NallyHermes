name: V2 Orchestra Reliability Benchmark

on:
  workflow_dispatch:
    inputs:
      model:
        description: "NVIDIA NIM model (keep fixed across benchmark rounds)"
        required: true
        default: "nvidia/nemotron-3.5-super-vl-120b-a12b"
        type: string

permissions:
  contents: write

concurrency:
  group: orchestra-v2-reliability-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: Run four sequential V2 missions
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      DATABASE_URL: ${{ secrets.BENCHMARK_DATABASE_URL }}
      NVIDIA_NIM_MODEL: ${{ inputs.model }}
      NVIDIA_NIM_BASE_URL: https://integrate.api.nvidia.com/v1
      TELEGRAM_BOT_TOKEN: "benchmark-placeholder-not-used"
      WEBHOOK_URL: https://example.invalid/telegram-webhook
      WEBHOOK_SECRET: "github-actions-benchmark-placeholder-secret-0001"
      DEFAULT_TIMEZONE: Africa/Lagos
      LIGHTRAG_ENABLED: "false"
      NODE_ENV: test
      AGENT_MAX_MODEL_ROUNDS: "12"
      AGENT_MAX_PLAN_MODEL_TURNS: "100"
      AGENT_MAX_TOOL_CALLS: "120"
      AGENT_MAX_PLAN_TOOL_ROUNDS: "60"
      AGENT_MAX_STEP_TOOL_ROUNDS: "15"
      AGENT_MAX_PARALLEL_PLAN_STEPS: "5"
      AGENT_MAX_PARALLEL_TOOL_CALLS: "5"
      AGENT_PLAN_TIMEOUT_MS: "480000"
      AGENT_MODEL_TIMEOUT_MS: "120000"
      AGENT_MAX_READ_RETRIES: "2"

    steps:
      - name: Check out V2 source
        uses: actions/checkout@v4
        with:
          ref: v2
          path: v2

      - name: Record exact V2 source revision
        shell: bash
        run: echo "BENCHMARK_V2_SHA=$(git -C v2 rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$NVIDIA_NIM_API_KEY" || { echo "::error::Add NVIDIA_NIM_API_KEY repository secret."; exit 1; }
          test -n "$TAVILY_API_KEY" || { echo "::error::Add TAVILY_API_KEY repository secret."; exit 1; }
          test -n "$DATABASE_URL" || { echo "::error::Add BENCHMARK_DATABASE_URL repository secret pointing to an isolated Neon database."; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install V2 dependencies
        working-directory: v2
        run: npm install --no-audit --no-fund

      - name: Run 1 of 4
        working-directory: v2
        env:
          BENCHMARK_VERSION: v2-run-1
          BENCHMARK_SHA: ${{ env.BENCHMARK_V2_SHA }}
          BENCHMARK_USER_ID: "900000000000000101"
        run: npx tsx benchmarks/run.ts && cp benchmarks/results/run.json benchmarks/results/v2-run-1.json

      - name: Run 2 of 4
        working-directory: v2
        env:
          BENCHMARK_VERSION: v2-run-2
          BENCHMARK_SHA: ${{ env.BENCHMARK_V2_SHA }}
          BENCHMARK_USER_ID: "900000000000000102"
        run: npx tsx benchmarks/run.ts && cp benchmarks/results/run.json benchmarks/results/v2-run-2.json

      - name: Run 3 of 4
        working-directory: v2
        env:
          BENCHMARK_VERSION: v2-run-3
          BENCHMARK_SHA: ${{ env.BENCHMARK_V2_SHA }}
          BENCHMARK_USER_ID: "900000000000000103"
        run: npx tsx benchmarks/run.ts && cp benchmarks/results/run.json benchmarks/results/v2-run-3.json

      - name: Run 4 of 4
        working-directory: v2
        env:
          BENCHMARK_VERSION: v2-run-4
          BENCHMARK_SHA: ${{ env.BENCHMARK_V2_SHA }}
          BENCHMARK_USER_ID: "900000000000000104"
        run: npx tsx benchmarks/run.ts && cp benchmarks/results/run.json benchmarks/results/v2-run-4.json

      - name: Aggregate four-run results
        working-directory: v2
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir = 'benchmarks/results';
          const runs = [1, 2, 3, 4].map((n) => JSON.parse(fs.readFileSync(`${dir}/v2-run-${n}.json`, 'utf8')));
          const values = (key) => runs.map((run) => Number(run[key])).filter(Number.isFinite).sort((a, b) => a - b);
          const median = (items) => {
            if (!items.length) return null;
            const mid = Math.floor(items.length / 2);
            return items.length % 2 ? items[mid] : (items[mid - 1] + items[mid]) / 2;
          };
          const summary = (key) => {
            const data = values(key);
            if (!data.length) return null;
            const mean = data.reduce((sum, value) => sum + value, 0) / data.length;
            const variance = data.reduce((sum, value) => sum + (value - mean) ** 2, 0) / data.length;
            return {
              min: data[0],
              median: median(data),
              max: data[data.length - 1],
              mean: Number(mean.toFixed(2)),
              standard_deviation: Number(Math.sqrt(variance).toFixed(2)),
              range: data[data.length - 1] - data[0]
            };
          };
          const duration = summary('duration_ms');
          const metrics = {
            duration_ms: duration,
            model_calls: summary('model_calls_count'),
            tool_errors: {
              values: runs.map((run) => run.metrics.tool_errors),
              total: runs.reduce((sum, run) => sum + run.metrics.tool_errors, 0)
            },
            task_outcomes: runs.map((run) => run.task_status),
            complete_runs: runs.filter((run) => run.task_status === 'complete').length,
            partial_runs: runs.filter((run) => run.task_status === 'partial').length,
            failed_runs: runs.filter((run) => run.task_status === 'failed').length,
            median_model_call_count: median(runs.map((run) => run.metrics.model_call_count).filter(Number.isFinite)),
            median_cached_tool_results: median(runs.map((run) => run.metrics.cached_tool_results).filter(Number.isFinite))
          };
          const report = [
            '# V2 Orchestra — Four-Run Reliability Benchmark',
            '',
            '## Benchmark controls',
            '',
            `- V2 commit: ${runs[0].git_sha}`,
            `- Model: ${runs[0].model}`,
            '- Scenario, prompt, tool limits, provider endpoint, and benchmark database configuration are held constant.',
            '- Four runs execute sequentially to avoid deliberately adding concurrency pressure to the model provider.',
            '- Each run uses a distinct synthetic user ID. LightRAG is disabled for this web-research scenario.',
            '',
            '## Results',
            '',
            '| Run | Duration (s) | Model calls | Tool calls | Tool errors | Task outcome |',
            '|---:|---:|---:|---:|---:|---|',
            ...runs.map((run, index) => `| ${index + 1} | ${(run.duration_ms / 1000).toFixed(2)} | ${run.metrics.model_call_count ?? 'n/a'} | ${run.metrics.tool_call_starts} | ${run.metrics.tool_errors} | ${run.task_status} |`),
            '',
            '## Latency distribution',
            '',
            '| Statistic | Duration (seconds) |',
            '|---|---:|',
            ...Object.entries(duration ?? {}).map(([key, value]) => `| ${key.replaceAll('_', ' ')} | ${(value / 1000).toFixed(2)} |`),
            '',
            '## Reliability',
            '',
            `- Complete runs: ${metrics.complete_runs}/4`,
            `- Partial runs: ${metrics.partial_runs}/4`,
            `- Failed runs: ${metrics.failed_runs}/4`,
            `- Total tool errors: ${metrics.tool_errors.total}`,
            '',
            '## Interpretation',
            '',
            '- Four observations are a small diagnostic sample, not a statistically conclusive performance claim.',
            '- Compare task outcomes, error counts, and per-run traces before interpreting latency differences.',
            '- A workflow success means the runner completed; it does not mean the research task was complete or factually correct.',
            '- Quality scores remain a separate human review using `benchmarks/quality-rubric.md`.',
            '',
            '## Raw traces',
            '',
            ...runs.map((_, index) => `- Run ${index + 1}: ` + `\`v2-run-${index + 1}.json\``)
          ];
          fs.writeFileSync(`${dir}/benchmark.md`, report.join('\n') + '\n');
          fs.writeFileSync(`${dir}/benchmark.json`, JSON.stringify({
            schema_version: 1,
            scenario: 'LightRAG official documentation and storage research',
            created_at: new Date().toISOString(),
            git_sha: runs[0].git_sha,
            model: runs[0].model,
            runs,
            summary: metrics
          }, null, 2) + '\n');
          NODE

      - name: Upload raw traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestra-v2-four-run-traces-${{ github.run_id }}
          path: |
            v2/benchmarks/results/v2-run-1.json
            v2/benchmarks/results/v2-run-2.json
            v2/benchmarks/results/v2-run-3.json
            v2/benchmarks/results/v2-run-4.json
          if-no-files-found: warn
          retention-days: 90

      - name: Commit benchmark reports
        if: success()
        working-directory: v2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/results/benchmark.md benchmarks/results/benchmark.json benchmarks/results/v2-run-1.json benchmarks/results/v2-run-2.json benchmarks/results/v2-run-3.json benchmarks/results/v2-run-4.json
          git commit -m "bench: record four-run V2 Orchestra reliability results"
          git push origin HEAD:v2
