name: V1 vs V2 Orchestra Benchmark

on:
  workflow_dispatch:
    inputs:
      model:
        description: "NVIDIA NIM model (must be available to the supplied API key)"
        required: true
        default: "nvidia/nemotron-3.5-super-vl-120b-a12b"
        type: string

permissions:
  contents: write

concurrency:
  group: orchestra-benchmark
  cancel-in-progress: false

jobs:
  compare:
    name: Run identical research task on V1 and V2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      DATABASE_URL: ${{ secrets.BENCHMARK_DATABASE_URL }}
      NVIDIA_NIM_MODEL: ${{ inputs.model }}
      NVIDIA_NIM_BASE_URL: https://integrate.api.nvidia.com/v1
      TELEGRAM_BOT_TOKEN: "benchmark-placeholder-not-used"
      WEBHOOK_URL: https://example.invalid/telegram-webhook
      WEBHOOK_SECRET: "github-actions-benchmark-placeholder-secret-0001"
      DEFAULT_TIMEZONE: Africa/Lagos
      LIGHTRAG_ENABLED: "false"
      NODE_ENV: test
      AGENT_MAX_MODEL_ROUNDS: "12"
      AGENT_MAX_PLAN_MODEL_TURNS: "100"
      AGENT_MAX_TOOL_CALLS: "120"
      AGENT_MAX_PLAN_TOOL_ROUNDS: "60"
      AGENT_MAX_STEP_TOOL_ROUNDS: "15"
      AGENT_MAX_PARALLEL_PLAN_STEPS: "5"
      AGENT_MAX_PARALLEL_TOOL_CALLS: "5"
      AGENT_PLAN_TIMEOUT_MS: "480000"
      AGENT_MODEL_TIMEOUT_MS: "120000"
      AGENT_MAX_READ_RETRIES: "2"

    steps:
      - name: Check out benchmark definition (V2 branch)
        uses: actions/checkout@v4
        with:
          ref: v2
          path: v2

      - name: Check out pinned V1 baseline
        uses: actions/checkout@v4
        with:
          ref: 4ba2b87084a4b003331e0f9c687bbf0822558edd
          path: v1

      - name: Record exact V2 source revision
        shell: bash
        run: echo "BENCHMARK_V2_SHA=$(git -C v2 rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$NVIDIA_NIM_API_KEY" || { echo "::error::Add NVIDIA_NIM_API_KEY repository secret."; exit 1; }
          test -n "$TAVILY_API_KEY" || { echo "::error::Add TAVILY_API_KEY repository secret."; exit 1; }
          test -n "$DATABASE_URL" || { echo "::error::Add BENCHMARK_DATABASE_URL repository secret pointing to an isolated Neon database."; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install V1 dependencies
        working-directory: v1
        run: npm install --no-audit --no-fund

      - name: Install V2 dependencies
        working-directory: v2
        run: npm install --no-audit --no-fund

      - name: Install identical benchmark runner into both source trees
        shell: bash
        run: |
          mkdir -p v1/benchmarks v2/benchmarks
          cp v2/benchmarks/run.ts v1/benchmarks/run.ts

      - name: Run V1 source
        working-directory: v1
        env:
          BENCHMARK_VERSION: v1
          BENCHMARK_SHA: 4ba2b87084a4b003331e0f9c687bbf0822558edd
          BENCHMARK_USER_ID: "900000000000000001"
        run: npx tsx benchmarks/run.ts

      - name: Run V2 source
        working-directory: v2
        env:
          BENCHMARK_VERSION: v2
          BENCHMARK_SHA: ${{ env.BENCHMARK_V2_SHA }}
          BENCHMARK_USER_ID: "900000000000000002"
        run: npx tsx benchmarks/run.ts

      - name: Build comparison report
        working-directory: v2
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const v1 = JSON.parse(fs.readFileSync('../v1/benchmarks/results/run.json', 'utf8'));
          const v2 = JSON.parse(fs.readFileSync('benchmarks/results/run.json', 'utf8'));
          const pct = (a, b) => a > 0 ? ((b - a) / a * 100).toFixed(1) + '%' : 'n/a';
          const metrics = [
            ['Duration (ms)', v1.duration_ms, v2.duration_ms],
            ['Model calls', v1.metrics.model_telemetry_supported ? v1.metrics.model_call_count : 'not instrumented', v2.metrics.model_telemetry_supported ? v2.metrics.model_call_count : 'not instrumented'],
            ['Median input tokens / call', v1.metrics.median_input_tokens_per_call ?? 'n/a', v2.metrics.median_input_tokens_per_call ?? 'n/a'],
            ['Median output tokens / call', v1.metrics.median_output_tokens_per_call ?? 'n/a', v2.metrics.median_output_tokens_per_call ?? 'n/a'],
            ['Median total tokens / call', v1.metrics.median_total_tokens_per_call ?? 'n/a', v2.metrics.median_total_tokens_per_call ?? 'n/a'],
            ['Model-call errors', v1.metrics.model_telemetry_supported ? v1.metrics.model_call_errors : 'not instrumented', v2.metrics.model_telemetry_supported ? v2.metrics.model_call_errors : 'not instrumented'],
            ['Progress events', v1.metrics.progress_event_count, v2.metrics.progress_event_count],
            ['Tool calls started', v1.metrics.tool_call_starts, v2.metrics.tool_call_starts],
            ['Tool errors', v1.metrics.tool_errors, v2.metrics.tool_errors],
            ['Retry events', v1.metrics.retry_events, v2.metrics.retry_events],
            ['Plan steps started', v1.metrics.planned_step_starts, v2.metrics.planned_step_starts],
            ['Plan steps completed', v1.metrics.completed_step_events, v2.metrics.completed_step_events],
            ['Plan steps failed', v1.metrics.failed_step_events, v2.metrics.failed_step_events]
          ];
          const lines = [
            '# NallyHermes V1 vs V2 Orchestra Benchmark',
            '',
            '## Run metadata',
            '',
            '| Field | V1 | V2 |',
            '|---|---|---|',
            '| Commit | ' + v1.git_sha + ' | ' + v2.git_sha + ' |',
            '| Model | ' + v1.model + ' | ' + v2.model + ' |',
            '| Status | ' + v1.status + ' | ' + v2.status + ' |',
            '',
            '## Execution metrics',
            '',
            '| Metric | V1 | V2 | V2 vs V1 |',
            '|---|---:|---:|---:|',
            ...metrics.map(([name, a, b]) => '| ' + name + ' | ' + a + ' | ' + b + ' | ' + pct(Number(a), Number(b)) + ' |'),
            '',
            '> Lower is not always better: fewer tool calls or events can mean efficiency, but can also mean incomplete work. Interpret metrics alongside the reports and event traces.',
            '',
            '## V1 final response',
            '',
            v1.answer || '_No final response returned._',
            '',
            '## V2 final response',
            '',
            v2.answer || '_No final response returned._',
            '',
            '## Human evaluation (0–5 each)',
            '',
            '| Dimension | V1 | V2 |',
            '|---|---:|---:|',
            '| Planning quality | pending | pending |',
            '| Research completeness | pending | pending |',
            '| Evidence quality | pending | pending |',
            '| Failure recovery | pending | pending |',
            '| Execution efficiency | pending | pending |',
            '| Final report quality | pending | pending |',
            '| Progress accuracy | pending | pending |',
            '',
            '## Limitations',
            '',
            '- This is one scenario/run per version; it is an observed comparison, not a statistically conclusive benchmark.',
            '- Both runs use the same configured model and API credentials, but provider-side nondeterminism and rate limits can affect results.',
            '- V1 emits legacy progress events; V2 additionally emits structured Orchestra events. Their event counts are not directly equivalent.',
            '- A completed workflow does not prove every factual claim is correct; inspect the source links in each answer.',
            '- The benchmark database is isolated from production. LightRAG is disabled for this research-only scenario.',
            '',
            '## Raw traces',
            '',
            '- V1: `v1/benchmarks/results/run.json` (also retained as an Actions artifact)',
            '- V2: `benchmarks/results/run.json`'
          ];
          fs.mkdirSync('benchmarks/results', { recursive: true });
          fs.writeFileSync('benchmarks/results/benchmark.md', lines.join('\n') + '\n');
          const combined = {
            schema_version: 1,
            scenario: 'LightRAG official documentation and storage research',
            created_at: new Date().toISOString(),
            v1,
            v2,
            comparison: {
              metrics: Object.fromEntries(metrics.map(([name, a, b]) => [String(name), { v1: a, v2: b }]))
            },
            human_scores: null
          };
          fs.writeFileSync('benchmarks/results/benchmark.json', JSON.stringify(combined, null, 2) + '\n');
          NODE

      - name: Upload raw traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestra-benchmark-traces-${{ github.run_id }}
          path: |
            v1/benchmarks/results/run.json
            v2/benchmarks/results/run.json
          if-no-files-found: warn
          retention-days: 90

      - name: Commit benchmark reports
        if: success()
        working-directory: v2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p benchmarks/results
          cp benchmarks/results/run.json benchmarks/results/v2-run.json
          cp ../v1/benchmarks/results/run.json benchmarks/results/v1-run.json
          git add benchmarks/results/benchmark.md benchmarks/results/benchmark.json benchmarks/results/v1-run.json benchmarks/results/v2-run.json
          git commit -m "bench: record V1 vs V2 Orchestra benchmark run"
          git push origin HEAD:v2
